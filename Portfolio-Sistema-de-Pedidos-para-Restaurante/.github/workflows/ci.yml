name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [8, 17, 21]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Compilar
        run: |
          mkdir -p out
          javac -encoding UTF-8 -d out $(find src -name '*.java')

      - name: Rodar testes das regras de negócio
        run: java -Dfile.encoding=UTF-8 -cp out br.com.restaurante.RegrasDeNegocioTest
